<!DOCTYPE html>
<html>
<head>
  <title>My Profile</title>
</head>
<body>

  <h1 style="text-align:center;">John Doe</h1>

  <!-- This div acts as a profile card containing image, description and a link -->
  <div style="background-color:#f0f8ff; border:3px solid #4682b4; border-radius:15px; width:350px; height:auto; padding:15px; margin:auto; text-align:center;">
    
    <img src="https://via.placeholder.com/120" alt="Avatar" width="120" height="120" style="border-radius:50%;">
    <br>
    <p>Hi! I'm a student who loves technology. My favorite hobby is 
      <span style="color:crimson; font-size:20px;">Coding</span> 
      and I enjoy building small projects in my free time.
    </p>

    <a href="https://www.google.com" style="text-decoration:none; color:white; background-color:#4682b4; padding:8px 15px; border-radius:8px;">Visit My Favorite Site</a>

  </div>

</body>
</html>
