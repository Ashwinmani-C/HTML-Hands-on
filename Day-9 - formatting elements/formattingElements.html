<!doctype html>
<html>

<head>
<title>formatting elements</title>
</head>

<body>

<!--  Inline elements    -->
<!--
<button>Click me</button>
<button>Click me</button>
<button>Click me</button>    <br><br>

<button style="background-color:pink;color:Blue;border:3px solid blue;border-radius:20px;height:50px;width:100px">Click here</button>
-->

<div style="background-color:yellow;height:300px;width:300px;margin:auto;text-align:center;margin-top:200px;padding-top:250px;box-sizing:border-box">
     <button>Ok</button>
     <button>Cancel</button>
</div>

<div style="background-color:yellow;height:300px;width:300px;margin:auto;text-align:center;margin-top:200px;box-sizing:border-box">
     <button style="margin-top:275px">Ok</button>
     <button>Cancel</button>
</div>

<!-- To get space between 2 buttons, only either 2 ways, either i) margin-right (for the left side button)  ii) margin-left (for the right side button) -->
<!-- i) margin-right(left side button) -> moves button from right to left  ii) margin-left(right side button) -> moves button from left to right   -->
<div style="background-color:yellow;height:300px;width:300px;margin:auto;text-align:center;margin-top:200px;box-sizing:border-box">
     <button style="margin-top:275px">Ok</button>
     <button style="margin-left:30px">Cancel</button>
</div>

<!-- To get space between 2 buttons, only either 2 ways, either i) margin-right (for the left side button)  ii) margin-left (for the right side button) -->
<!-- i) margin-right(left side button) -> moves button from right to left  ii) margin-left(right side button) -> moves button from left to right   -->
<div style="background-color:yellow;height:300px;width:300px;margin:auto;text-align:center;margin-top:200px;box-sizing:border-box">
     <button style="margin-top:275px;margin-right:30px">Ok</button>
     <button>Cancel</button>
</div>


</body>

</html>
